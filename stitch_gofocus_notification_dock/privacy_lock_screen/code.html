<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Privacy Lock Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom styles to ensure inputs hide default spinners/clear buttons for a cleaner numpad look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .numpad-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden font-display selection:bg-primary/30 selection:text-white">
<!-- Ambient Background Graphic -->
<div class="absolute inset-0 z-0 flex items-center justify-center overflow-hidden pointer-events-none">
<div class="w-[800px] h-[800px] bg-primary/5 rounded-full blur-[120px] mix-blend-screen opacity-50"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex h-full grow flex-col items-center justify-center p-4">
<!-- Security Card -->
<div class="flex flex-col w-full max-w-[420px] bg-white dark:bg-[#192633] rounded-2xl shadow-2xl border border-slate-200 dark:border-[#324d67] overflow-hidden">
<!-- Header Section -->
<div class="flex flex-col items-center justify-center pt-8 pb-4 px-6 text-center gap-3">
<div class="h-16 w-16 rounded-full bg-primary/10 flex items-center justify-center mb-1 ring-1 ring-primary/20">
<span class="material-symbols-outlined text-primary text-[32px]">lock</span>
</div>
<div class="flex flex-col gap-1">
<h1 class="text-slate-900 dark:text-white text-[28px] font-bold leading-tight">Station Locked</h1>
<p class="text-slate-500 dark:text-[#92adc9] text-sm font-normal">Current Station: <span class="text-slate-900 dark:text-white font-semibold">Exam Room 4</span></p>
</div>
<!-- Status Chip -->
<div class="mt-2 flex h-8 items-center justify-center gap-x-2 rounded-lg bg-emerald-500/10 dark:bg-[#233648] pl-2 pr-4 border border-emerald-500/20 dark:border-transparent">
<span class="material-symbols-outlined text-emerald-600 dark:text-white text-[20px]">verified_user</span>
<p class="text-emerald-700 dark:text-white text-sm font-medium leading-normal">Secure Environment</p>
</div>
</div>
<!-- Input & Keypad Section -->
<div class="flex flex-col px-6 pb-8 gap-6">
<!-- Input Field -->
<label class="flex flex-col w-full group">
<div class="flex w-full items-stretch rounded-xl border border-slate-200 dark:border-[#324d67] bg-slate-50 dark:bg-[#111a22] focus-within:ring-2 focus-within:ring-primary focus-within:border-primary transition-all overflow-hidden shadow-inner">
<div class="flex items-center justify-center pl-4 text-slate-400 dark:text-[#92adc9]">
<span class="material-symbols-outlined text-[24px]">key</span>
</div>
<input autocomplete="off" class="flex w-full min-w-0 flex-1 resize-none bg-transparent border-none h-16 text-center text-3xl font-bold tracking-[0.5em] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#586e84] placeholder:text-base placeholder:tracking-normal placeholder:font-normal focus:ring-0 px-4" placeholder="Enter Code" type="password" value=""/>
</div>
</label>
<!-- Touch Keypad -->
<div class="grid grid-cols-3 gap-3 px-2">
<!-- Row 1 -->
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">1</button>
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">2</button>
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">3</button>
<!-- Row 2 -->
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">4</button>
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">5</button>
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">6</button>
<!-- Row 3 -->
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">7</button>
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">8</button>
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">9</button>
<!-- Row 4 -->
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-transparent hover:bg-slate-100 dark:hover:bg-[#233648]/50 text-slate-400 dark:text-[#92adc9] transition-colors font-medium text-sm">Clear</button>
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-[#233648] hover:bg-slate-200 dark:hover:bg-[#2d445a] text-slate-900 dark:text-white text-xl font-semibold transition-colors border border-slate-200 dark:border-[#324d67]">0</button>
<button class="numpad-btn flex h-14 w-full cursor-pointer items-center justify-center rounded-lg bg-transparent hover:bg-slate-100 dark:hover:bg-[#233648]/50 text-slate-900 dark:text-white transition-colors">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 mt-2">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 bg-primary hover:bg-blue-600 text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-blue-500/25 transition-all active:scale-[0.98]">
<span class="mr-2 material-symbols-outlined text-[20px]">lock_open</span>
<span class="truncate">Unlock Station</span>
</button>
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-transparent text-slate-500 dark:text-[#92adc9] hover:text-red-600 dark:hover:text-red-400 text-sm font-medium leading-normal tracking-[0.015em] transition-colors group">
<span class="material-symbols-outlined text-[18px] mr-2 group-hover:scale-110 transition-transform">logout</span>
<span class="truncate">Emergency Logout</span>
</button>
</div>
</div>
<!-- Footer Progress/Decoration -->
<div class="h-1 w-full bg-slate-100 dark:bg-[#111a22]">
<div class="h-full w-1/3 bg-primary animate-pulse"></div>
</div>
</div>
<!-- Floating Footer Info -->
<div class="mt-8 text-center">
<p class="text-xs text-slate-400 dark:text-[#586e84] font-medium">System Version 4.2.0 • Secured by BlueNote</p>
</div>
</div>
</body></html>
