version: v2
managed:
  enabled: true
plugins:
  # Generate Dart protobuf classes using local protoc-gen-dart (version 20.0.1)
  - local: protoc-gen-dart
    out: ../lib/gen
    opt:
      - generate_kythe_info
    include_imports: true
    include_wkt: true
  
  # Generate ConnectRPC Dart clients
  - remote: buf.build/connectrpc/dart
    out: ../lib/gen
    include_imports: true
    include_wkt: true
