name: Build Tauri Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          # - platform: 'macos-latest'
          #   target: 'x86_64-apple-darwin'
          # - platform: 'macos-latest'
          #   target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # Install linuxdeploy for AppImage creation
          wget -O /tmp/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy-x86_64.AppImage
          sudo mv /tmp/linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Install frontend dependencies
        run: pnpm install

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      # - name: Upload artifacts (macOS)
      #   if: matrix.platform == 'macos-latest'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: macos-${{ matrix.target }}
      #     path: |
      #       src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      #       src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
